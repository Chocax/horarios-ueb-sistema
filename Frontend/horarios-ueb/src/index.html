<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Horarios UEB · Ingeniería de Sistemas</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" href="ueb-simbolo.png">
  <link rel="apple-touch-icon" href="ueb-simbolo.png">
  <!-- modo oscuro guardado en este navegador: se aplica antes de pintar -->
  <script src="tema.js"></script>
  <style>
    .ueb-arranque{--fondo:#f6f5f4;--t1:rgba(0,0,0,.95);--t2:rgba(0,0,0,.6);--pista:#e6f3fe}
    [data-theme=dark] .ueb-arranque{--fondo:#191918;--t1:rgba(255,255,255,.93);--t2:rgba(255,255,255,.62);--pista:#16304a}
    [data-theme=dark] body{background:#191918}
    @keyframes ueb-carga{from{transform:translateX(-110%)}to{transform:translateX(260%)}}
  </style>
</head>
<body>
  <!-- Pantalla de carga mientras se descarga la aplicación (Angular la reemplaza al arrancar) -->
  <app-root>
    <div class="ueb-arranque" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--fondo);font-family:'Inter Variable',Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;text-align:center;padding:0 24px">
      <img src="ueb-logo.png" alt="Universidad El Bosque" width="150" style="height:auto">
      <div style="margin-top:22px;font-size:26px;font-weight:600;letter-spacing:-0.6px;color:var(--t1)">Horarios UEB</div>
      <div style="margin-top:4px;font-size:13.5px;color:var(--t2)">Facultad de Ingeniería · Programa de Ingeniería de Sistemas</div>
      <div style="position:relative;width:220px;height:4px;margin-top:26px;border-radius:99px;background:var(--pista);overflow:hidden">
        <span style="position:absolute;inset:0;width:40%;border-radius:99px;background:#0075de;animation:ueb-carga 1.2s ease-in-out infinite"></span>
      </div>
      <div style="margin-top:14px;font-size:14px;font-weight:500;color:var(--t1)">Cargando el portal…</div>
    </div>
  </app-root>
</body>
</html>
