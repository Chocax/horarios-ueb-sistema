# =====================================================================================================
# Horarios UEB · configuración común
# Perfiles: «local» (por defecto, base H2 en archivo, no requiere instalar nada) y «prod» (MySQL en la nube).
# Ningún secreto va en este archivo: en producción todo llega por variables de entorno.
# =====================================================================================================
spring.application.name=horarios-ueb-back
spring.profiles.default=local

# Render asigna el puerto en la variable PORT
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=2KB
server.error.include-stacktrace=never
server.error.include-message=never
server.forward-headers-strategy=native

# ---------------------------------------------------------------- base de datos (Flyway crea y versiona el esquema)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.data.jdbc.repositories.enabled=false

# ---------------------------------------------------------------- seguridad
# Vigencia del token de sesión (horas)
app.jwt-horas=8
# Orígenes del front autorizados (separados por coma). En producción: la URL de Vercel.
app.cors-origenes=${CORS_ORIGINS:http://localhost:4200}
