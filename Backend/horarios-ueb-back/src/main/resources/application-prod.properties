# =====================================================================================================
# Perfil «prod»: MySQL en la nube (Aiven). Todos los valores llegan por variables de entorno:
#   DB_URL       jdbc:mysql://HOST:PUERTO/defaultdb?sslMode=REQUIRED&rewriteBatchedStatements=true&serverTimezone=UTC
#   DB_USER      usuario de la base de datos (avnadmin en Aiven)
#   DB_PASSWORD  contraseña de la base de datos
#   JWT_SECRET   secreto aleatorio de 32 caracteres o más para firmar los tokens
#   CORS_ORIGINS URL del front, p. ej. https://horarios-ueb.vercel.app
# =====================================================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# el plan gratuito limita las conexiones: un pool pequeño basta
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

app.jwt-secreto=${JWT_SECRET}
app.cors-origenes=${CORS_ORIGINS}

logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
