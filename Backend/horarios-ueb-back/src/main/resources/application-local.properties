# =====================================================================================================
# Perfil «local»: desarrollo en el computador sin instalar MySQL.
# Usa H2 en modo MySQL guardado en ./data (se crea solo y Flyway carga el esquema y los datos semilla).
# Para trabajar contra la base de datos de la nube, arranque con el perfil «prod» y las variables de entorno.
# =====================================================================================================
spring.datasource.url=jdbc:h2:file:./data/horarios-ueb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Secreto SOLO para desarrollo local. En producción se exige la variable JWT_SECRET.
app.jwt-secreto=${JWT_SECRET:solo-para-desarrollo-local-cambiar-en-produccion-1234567890}
app.cors-origenes=${CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
